; Valkyrie Drive mod options. Read by dinput8.dll at every game start: close the game, edit, start it.
; Every fix is independent; 0 = off (original game behaviour). What was applied: vdmod.log
[VDMod]

LargeAddressAware=1 ; 1 = check the exe has the 4 GB memory flag (Steam updates/verifies remove it);
                    ; if missing, offer to set it (VDPatch.exe). 0 = no check

GalleryHDFit=1      ; 1 = 2x/3x/4x CGs show at screen size in the gallery (needed with the HD CGs)
GalleryZoom=1       ; 1 = gallery opens pictures fit-to-screen, zooms to 1:1 pixels, pans the whole picture

MipFix=1            ; mipmaps for materials: 0 = vanilla (distant shimmer) | 1 = all (recommended)
                    ; | 2 = only 'mode 2+' materials | 3 = only 'mode 0' materials
Anisotropy=16       ; anisotropic filtering level for materials: 1..16, 0 = original trilinear
MaxResolution=3840x2160 ; Fullscreen sizes offered in Options > Screen Size go up to this instead of the
                    ; desktop size - for NVIDIA DSR / AMD VSR (enable the factor in the driver first).
                    ; Built-in sizes: 1920x1080, 2133x1200, 2560x1440, 3840x2160; another size is added
                    ; as the top choice. In Fullscreen the screen switches to the chosen size (the game
                    ; itself always used the desktop size). Window/borderless stay limited by the
                    ; desktop. 0 = original
MSAAFix=1          ; 1 = no white flashing blobs on thin edges (fences, grass, ground decals) with MSAA on
BlackWallFix=1      ; 1 = no black patches flickering on some walls (game bug: invisible depth-only meshes
                    ; placed exactly on those walls; they get a tiny depth bias so the wall always wins)
ShadowResolution=4096 ; character shadow map size: 512 (shipped), 1024, 2048, 4096 (recommended) or 8192.
                    ; Checked at every start: MeigeAppWin.cfg is rewritten if it differs (Steam verify
                    ; resets it to 512). 0 = leave MeigeAppWin.cfg alone

SkipIntro=3         ; boot: MARVELOUS video, HPG, Meteorise, CRIWARE logos, then the opening movie (OP)
                    ; 0 = original | 1 = skip the 3 logos | 2 = skip the video + 3 logos, keep the OP
                    ; | 3 = skip all, straight to the title menu (the OP still plays as the idle attract)
FastDlcCheck=1      ; 1 = run the boot "Checking DLC" step at unlimited speed
SkipRoomRanking=1   ; 1 = leave the Dressing Room at once: no "Server Connect" box and no upload of your
                    ; score to the Steam Dressing Room leaderboard (what happens offline anyway)

FrameRate=120       ; 60 (original), 80, 96, 120, 160 or 240 - must divide 480 (game logic).
                    ; The in-game frame setting then offers FrameRate, FrameRate/2, ...
PreciseLimiter=1    ; 1 = exact frame pacing (original limiter overshoots: ~87 fps instead of 120, stutters at 60)
ForceVSyncOff=1     ; 1 = needed above 60 fps (the game's fullscreen mode is 60 Hz, vsync would cap there)

PhysicsRate=30      ; hair/bust physics behave like this frame rate (Vita = 30), still shown smoothly every
                    ; frame | 0 = original (swings much more above 30 fps)
